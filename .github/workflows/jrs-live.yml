name: jrs-live

on:
  schedule:
    - cron: "*/30 * * * *"   # 每 30 分钟刷新赛程与流地址
  workflow_dispatch: {}       # 支持手动触发

permissions:
  contents: write

concurrency:
  group: jrs-live
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape JRS matches
        continue-on-error: true
        run: |
          python3 scripts/jrs_scraper.py jrs.txt

      - name: Build combined TVBox live source (JRS groups first, iptv4 after)
        run: |
          python3 - <<'PY'
          jrs = open("jrs.txt", encoding="utf-8").read().rstrip()
          iptv = open("iptv4.txt", encoding="utf-8").read().lstrip()
          with open("tvbox.txt", "w", encoding="utf-8") as f:
              f.write(jrs + "\n" + iptv)
          print("tvbox.txt built, lines:", sum(1 for _ in open("tvbox.txt")))
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jrs.txt tvbox.txt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update jrs live source $(date -u +%Y-%m-%d_%H:%M)"
            git push
          fi

      - name: Purge jsDelivr cache
        run: |
          curl -s -X POST https://purge.jsdelivr.net/ \
            -H "Content-Type: application/json" \
            -d '{"path":["/gh/zzy867888030-collab/tv-live@main/tvbox.txt","/gh/zzy867888030-collab/tv-live@main/jrs.txt"]}' || true
